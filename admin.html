<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM — Kênh Tay Trái</title>
<link rel="icon" href="assets/favicon/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=26">
<style>
  /* Trang quản trị — dùng chung token & font của styles.css, class tiền tố adm- */
  body{background:var(--bg-2);}
  .adm{max-width:1180px;margin-inline:auto;padding:28px var(--pad-x) 90px;}

  .adm__bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--hairline);
  }
  .adm__brand{display:flex;align-items:baseline;gap:10px;}
  .adm__brand b{font-family:var(--font-head);font-size:1.25rem;letter-spacing:-0.02em;}
  .adm__brand span{font-size:12px;color:var(--fg-3);}
  .adm__baractions{display:flex;align-items:center;gap:10px;}

  .adm h2.adm__h{font-size:1.125rem;margin-bottom:14px;}
  .adm__sec{margin-bottom:34px;}

  /* ---- Đăng nhập ---- */
  .adm__login{
    max-width:400px;margin:12vh auto 0;background:var(--bg-1);
    border:1px solid var(--hairline);border-radius:var(--r-anchor);padding:34px 30px;
  }
  .adm__login h1{font-size:1.5rem;margin-bottom:8px;}
  .adm__login p{font-size:0.875rem;color:var(--fg-3);line-height:1.6;margin-bottom:24px;}
  .adm__field{margin-bottom:16px;}
  .adm__field label{
    display:block;font-size:11px;font-weight:700;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--label);margin-bottom:6px;
  }
  .adm__field input{
    width:100%;font-family:var(--font-body);font-size:1rem;color:var(--fg-1);
    padding:11px 13px;background:var(--bg-2);
    border:1.5px solid var(--hairline);border-radius:var(--r-input);
  }
  .adm__field input:focus{outline:none;border-color:var(--fg-1);background:var(--bg-1);}
  .adm__err{
    display:none;font-size:0.875rem;color:#B3261E;background:#B3261E14;
    border-radius:8px;padding:10px 13px;margin-bottom:14px;line-height:1.5;
  }
  .adm__err.is-on{display:block;}

  /* ---- Khối Hôm nay ---- */
  .adm__today{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:14px;margin-bottom:34px;
  }
  .adm__todaycol{
    background:var(--bg-1);border:1px solid var(--hairline);
    border-radius:var(--r-card);padding:18px 20px;
  }
  .adm__todaycol--late{border-color:#E0A29A;background:#B3261E08;}
  .adm__todaycol h3{
    font-size:0.9375rem;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;
  }
  .adm__count{
    font-family:var(--font-body);font-weight:700;font-size:0.75rem;
    background:var(--bg-3);border-radius:var(--r-pill);padding:2px 9px;
  }
  .adm__todaycol--late .adm__count{background:#B3261E1a;color:#8C1D18;}
  .adm__todaysub{font-size:0.8125rem;color:var(--fg-3);margin-bottom:12px;}
  .adm__mini{display:flex;flex-direction:column;gap:2px;}
  .adm__minirow{
    width:100%;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:8px 10px;margin-inline:-10px;border-radius:9px;text-align:left;
    font-size:0.875rem;transition:background-color .15s ease;
  }
  .adm__minirow:hover{background:var(--hover);}
  .adm__minirow b{font-family:var(--font-body);font-weight:600;}
  .adm__minirow span{color:var(--fg-3);font-size:0.8125rem;}
  .adm__none{font-size:0.875rem;color:var(--fg-3);}

  /* ---- Chip hạng & trạng thái ---- */
  .adm__grade{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;flex:none;
    font-family:var(--font-body);font-weight:700;font-size:0.75rem;
  }
  .adm__grade--A{background:var(--mint);color:var(--fg-1);}
  .adm__grade--B{background:var(--yellow);color:var(--fg-1);}
  .adm__grade--C{background:var(--bg-4);color:var(--fg-3);}

  .adm__st{
    display:inline-block;padding:3px 11px;border-radius:var(--r-pill);
    font-size:11px;font-weight:700;background:var(--bg-3);color:var(--fg-2);white-space:nowrap;
  }
  .adm__st--chot{background:var(--mint-soft);color:var(--fg-1);}
  .adm__st--loai{background:var(--bg-4);color:var(--fg-4);}
  .adm__st--dang{background:var(--sky-soft);color:var(--fg-1);}

  /* ---- Thẻ số liệu ---- */
  .adm__stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;
  }
  .adm__stat{
    background:var(--bg-1);border:1px solid var(--hairline);
    border-radius:var(--r-card);padding:17px 19px;
  }
  .adm__stat dt{
    font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--label);margin-bottom:8px;
  }
  .adm__stat dd{
    font-family:var(--font-head);font-weight:700;font-size:1.875rem;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .adm__stat small{
    display:block;margin-top:7px;font-family:var(--font-body);font-weight:400;
    font-size:0.8125rem;color:var(--fg-3);line-height:1.4;
  }

  /* ---- Biểu đồ ---- */
  .adm__charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(305px,1fr));gap:14px;}
  .adm__chart{
    background:var(--bg-1);border:1px solid var(--hairline);
    border-radius:var(--r-card);padding:19px 20px;
  }
  .adm__chart h3{font-size:0.9375rem;margin-bottom:4px;}
  .adm__charthint{font-size:0.8125rem;color:var(--fg-3);margin-bottom:14px;line-height:1.45;}
  .adm__row{margin-bottom:11px;}
  .adm__row:last-child{margin-bottom:0;}
  .adm__rowtop{
    display:flex;justify-content:space-between;gap:12px;
    font-size:0.8125rem;color:var(--fg-2);margin-bottom:5px;line-height:1.35;
  }
  .adm__rowtop b{flex:none;font-family:var(--font-body);color:var(--fg-1);font-variant-numeric:tabular-nums;}
  .adm__track{height:7px;border-radius:4px;background:var(--row);overflow:hidden;}
  .adm__fill{height:100%;border-radius:4px;background:var(--mint);}
  .adm__fill--dim{background:var(--fg-4);}

  /* phễu */
  .adm__funnel .adm__rowtop b{font-size:0.875rem;}
  .adm__loai{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline);
    font-size:0.8125rem;color:var(--fg-3);
  }

  /* bảng nguồn */
  .adm__tbl{width:100%;border-collapse:collapse;font-size:0.8125rem;}
  .adm__tbl th{
    text-align:right;font-size:10px;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--label);padding:0 0 8px;
  }
  .adm__tbl th:first-child,.adm__tbl td:first-child{text-align:left;}
  .adm__tbl td{
    padding:8px 0;border-top:1px solid var(--hairline);
    text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums;
  }
  .adm__tbl td:first-child{color:var(--fg-1);}

  /* cột tuần */
  .adm__weeks{display:flex;align-items:flex-end;gap:7px;height:110px;}
  .adm__week{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px;}
  .adm__weekbar{background:var(--mint);border-radius:4px 4px 0 0;min-height:2px;}
  .adm__weeklab{font-size:9px;color:var(--fg-4);text-align:center;letter-spacing:-0.02em;}
  .adm__weeknum{
    font-size:11px;font-weight:700;text-align:center;color:var(--fg-2);
    font-variant-numeric:tabular-nums;
  }

  /* ---- Lọc ---- */
  .adm__filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .adm__fchip{
    padding:7px 15px;border-radius:var(--r-pill);font-size:0.8125rem;font-weight:600;
    background:var(--bg-1);border:1.5px solid var(--hairline);color:var(--fg-2);
    transition:border-color .15s ease,background-color .15s ease;white-space:nowrap;
  }
  .adm__fchip:hover{border-color:var(--fg-3);}
  .adm__fchip.is-on{background:var(--fg-1);border-color:var(--fg-1);color:#fff;}
  .adm__fchip i{font-style:normal;opacity:0.6;margin-left:5px;font-variant-numeric:tabular-nums;}

  .adm__listhead{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:14px;
  }
  .adm__search{
    font-family:var(--font-body);font-size:0.9375rem;padding:9px 15px;min-width:250px;
    background:var(--bg-1);border:1.5px solid var(--hairline);border-radius:var(--r-pill);
  }
  .adm__search:focus{outline:none;border-color:var(--fg-1);}

  /* ---- Thẻ đơn ---- */
  .adm__card{
    background:var(--bg-1);border:1px solid var(--hairline);
    border-radius:var(--r-card);margin-bottom:11px;overflow:hidden;
  }
  .adm__card--late{border-color:#E0A29A;}
  .adm__cardhead{
    width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;
    align-items:center;text-align:left;padding:15px 19px;transition:background-color .15s ease;
  }
  .adm__cardhead:hover{background:var(--hover);}
  .adm__who b{font-family:var(--font-head);font-size:1.0625rem;}
  .adm__meta{
    display:flex;flex-wrap:wrap;gap:6px 13px;margin-top:5px;
    font-size:0.8125rem;color:var(--fg-3);align-items:center;
  }
  .adm__when{font-size:0.8125rem;color:var(--fg-3);white-space:nowrap;text-align:right;}
  .adm__due{font-weight:600;}
  .adm__due--late{color:#8C1D18;}

  .adm__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.16,1,.3,1);}
  .adm__body.is-open{grid-template-rows:1fr;}
  .adm__bodyinner{overflow:hidden;min-height:0;}
  .adm__detail{padding:2px 19px 19px;border-top:1px solid var(--hairline);}

  /* khối CRM */
  .adm__crm{
    background:var(--bg-2);border-radius:var(--r-card);
    padding:16px 17px;margin:14px 0 4px;
  }
  .adm__crmlab{
    font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--label);margin-bottom:8px;
  }
  .adm__pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .adm__pill{
    padding:6px 13px;border-radius:var(--r-pill);font-size:0.8125rem;font-weight:600;
    background:var(--bg-1);border:1.5px solid var(--hairline);color:var(--fg-2);
    transition:border-color .15s ease;white-space:nowrap;
  }
  .adm__pill:hover:not(.is-on){border-color:var(--fg-3);}
  .adm__pill.is-on{background:var(--fg-1);border-color:var(--fg-1);color:#fff;}
  .adm__pill:disabled{opacity:0.5;pointer-events:none;}

  .adm__crmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .adm__date{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .adm__date input{
    font-family:var(--font-body);font-size:0.875rem;color:var(--fg-1);
    padding:7px 11px;background:var(--bg-1);
    border:1.5px solid var(--hairline);border-radius:var(--r-input);
  }
  .adm__date input:focus{outline:none;border-color:var(--fg-1);}
  .adm__mini-btn{
    padding:6px 11px;border-radius:var(--r-pill);font-size:0.75rem;font-weight:600;
    background:var(--bg-1);border:1.5px solid var(--hairline);color:var(--fg-2);
  }
  .adm__mini-btn:hover{border-color:var(--fg-3);}

  .adm__note{
    width:100%;font-family:var(--font-body);font-size:0.875rem;line-height:1.6;
    color:var(--fg-1);padding:10px 12px;background:var(--bg-1);
    border:1.5px solid var(--hairline);border-radius:var(--r-input);
    resize:vertical;min-height:76px;
  }
  .adm__note:focus{outline:none;border-color:var(--fg-1);}
  .adm__save{font-size:0.75rem;color:var(--fg-4);margin-top:5px;min-height:16px;}
  .adm__save--err{color:#8C1D18;cursor:pointer;text-decoration:underline;}

  .adm__acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}

  /* chi tiết câu trả lời */
  .adm__qa{margin-top:15px;}
  .adm__qa dt{
    font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--label);margin-bottom:5px;
  }
  .adm__qa dd{font-size:0.9375rem;line-height:1.65;color:var(--fg-2);white-space:pre-wrap;}
  .adm__grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:15px;}
  .adm__contact dd a{
    color:var(--fg-1);font-weight:600;
    text-decoration:underline;text-decoration-color:var(--sky);
    text-decoration-thickness:2px;text-underline-offset:3px;
  }
  .adm__empty{
    background:var(--bg-1);border:1px dashed var(--fg-4);border-radius:var(--r-card);
    padding:40px 20px;text-align:center;color:var(--fg-3);font-size:0.9375rem;
  }

  @media (max-width:600px){
    .adm__cardhead{grid-template-columns:auto 1fr;}
    .adm__when{grid-column:1 / -1;text-align:left;}
    .adm__filters{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none;padding-bottom:2px;}
    .adm__filters::-webkit-scrollbar{display:none;}
    .adm__fchip{flex:0 0 auto;}
    .adm__search{min-width:0;width:100%;}
  }
</style>
</head>
<body>

<!-- ================= ĐĂNG NHẬP ================= -->
<div class="adm__login" id="loginView">
  <h1>CRM Kênh Tay Trái</h1>
  <p>Đăng nhập bằng tài khoản Supabase của bạn (namanhsuit@gmail.com).</p>
  <form id="loginForm">
    <div class="adm__err" id="loginErr"></div>
    <div class="adm__field">
      <label for="admEmail">Email</label>
      <input type="email" id="admEmail" autocomplete="username" required>
    </div>
    <div class="adm__field">
      <label for="admPass">Mật khẩu</label>
      <input type="password" id="admPass" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--mint" style="width:100%" id="loginBtn">Đăng nhập</button>
  </form>
</div>

<!-- ================= BẢNG ĐIỀU KHIỂN ================= -->
<div class="adm" id="dashView" hidden>

  <div class="adm__bar">
    <div class="adm__brand"><b>CRM</b><span>Kênh Tay Trái</span></div>
    <div class="adm__baractions">
      <button class="btn btn--outline btn--sm" id="reloadBtn">Tải lại</button>
      <button class="btn btn--outline btn--sm" id="csvBtn">Tải CSV</button>
      <button class="btn btn--outline btn--sm" id="logoutBtn">Đăng xuất</button>
    </div>
  </div>

  <div class="adm__today" id="today"></div>

  <div class="adm__sec"><dl class="adm__stats" id="stats"></dl></div>

  <div class="adm__sec">
    <h2 class="adm__h">Bán hàng</h2>
    <div class="adm__charts" id="salesCharts"></div>
  </div>

  <div class="adm__sec">
    <h2 class="adm__h">Chân dung người đăng ký</h2>
    <div class="adm__charts" id="distCharts"></div>
  </div>

  <div class="adm__sec">
    <div class="adm__listhead">
      <h2 class="adm__h" style="margin:0">Từng đơn</h2>
      <input type="search" class="adm__search" id="search" placeholder="Tìm theo tên, email, SĐT, ghi chú...">
    </div>
    <div class="adm__filters" id="filters"></div>
    <div id="list"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://gedyrwfhqpjrfcptrnck.supabase.co';
  // Publishable key — an toàn ở client. RLS khoá SELECT/UPDATE theo đúng uid Nam Anh.
  var SUPABASE_KEY = 'sb_publishable_ywvY3y_NilX7LnuOtwyToQ_lAnRT9Oe';
  var STORE = 'ktt_admin_session';

  /* =========================================================
     CHẤM ĐIỂM ƯU TIÊN — chỉnh bảng này là đổi được cách xếp hạng.
     Chuỗi copy NGUYÊN VĂN từ value các lựa chọn trong index.html
     (chú ý dấu gạch en "–", không phải "-").
     ========================================================= */
  var SCORING = {
    urgency: {
      'Càng sớm càng tốt': 4,
      'Trong vòng 1 tháng tới': 3,
      'Trong năm nay': 1,
      'Chưa chắc, để xem đã': 0
    },
    following: {
      'Hơn 1 năm': 2,
      '6–12 tháng': 1,
      '1–6 tháng': 1,
      'Dưới 1 tháng': 0,
      'Mình vừa mới biết đến': 0
    },
    income: {
      'Trên 150 triệu': 2,
      '80 – 150 triệu': 2,
      '50 – 80 triệu': 2,
      '25 – 50 triệu': 1,
      '10 – 25 triệu': 0,
      'Dưới 10 triệu': 0
    },
    commitSanSang: 2,     // commit chứa "sẵn sàng"
    nguongA: 7,           // >= là hạng A
    nguongB: 4            // >= là hạng B, dưới nữa là C
  };

  function scoreOf(r) {
    var s = 0;
    s += SCORING.urgency[r.urgency] || 0;
    s += SCORING.following[r.following] || 0;
    s += SCORING.income[r.income] || 0;
    if ((r.commit || '').indexOf('sẵn sàng') > -1) s += SCORING.commitSanSang;
    return s;
  }
  function gradeOf(r) {
    var s = scoreOf(r);
    return s >= SCORING.nguongA ? 'A' : s >= SCORING.nguongB ? 'B' : 'C';
  }

  /* ================= TRẠNG THÁI PHỄU ================= */
  var STATUS = {
    moi:           { label: 'Mới',            kieu: '' },
    da_lien_he:    { label: 'Đã liên hệ',     kieu: 'dang' },
    da_dat_lich:   { label: 'Đã đặt lịch',    kieu: 'dang' },
    da_meeting:    { label: 'Đã meeting',     kieu: 'dang' },
    chot:          { label: 'Chốt ✓',         kieu: 'chot' },
    tu_choi:       { label: 'Từ chối',        kieu: 'loai' },
    khong_phu_hop: { label: 'Không phù hợp',  kieu: 'loai' }
  };
  var PHEU = ['moi', 'da_lien_he', 'da_dat_lich', 'da_meeting', 'chot'];
  var LOAI = ['tu_choi', 'khong_phu_hop'];
  var DANG_CHAY = ['moi', 'da_lien_he', 'da_dat_lich', 'da_meeting'];

  /* ================= TRẠNG THÁI TRANG ================= */
  var session = null;
  var rows = [];
  var openIds = {};          // id -> true, giữ thẻ đang mở qua các lần render lại
  var fStatus = null;        // null = tất cả
  var fGradeA = false;
  var query = '';
  var noteTimers = {};

  var $ = function (id) { return document.getElementById(id); };
  var loginView = $('loginView'), dashView = $('dashView');

  /* ================= GỌI API ================= */
  function authRequest(grant, body) {
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (d) {
        if (!res.ok) throw new Error(d.error_description || d.msg || d.message || 'Đăng nhập thất bại');
        return d;
      });
    });
  }

  // Gọi REST kèm token; 401 thì làm mới token ĐÚNG MỘT LẦN rồi thử lại.
  function api(path, opts, daThuLai) {
    opts = opts || {};
    var headers = {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + (session && session.access_token),
      'Content-Type': 'application/json'
    };
    if (opts.prefer) headers.Prefer = opts.prefer;

    return fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method: opts.method || 'GET', headers: headers, body: opts.body
    }).then(function (res) {
      if (res.status === 401 && !daThuLai && session && session.refresh_token) {
        return authRequest('refresh_token', { refresh_token: session.refresh_token })
          .then(function (fresh) { session = fresh; saveSession(fresh); return api(path, opts, true); })
          .catch(function () { veManDangNhap(); throw new Error('Phiên hết hạn'); });
      }
      if (!res.ok) return res.text().then(function (t) { throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 120)); });
      return res.status === 204 ? null : res.json();
    });
  }

  function loadRows() {
    return api('ktt_applications?select=*&order=created_at.desc').then(function (d) { rows = d || []; });
  }

  // Cập nhật một đơn. Trả về bản ghi mới để gán tại chỗ, KHÔNG tải lại cả bảng.
  function patchRow(id, patch) {
    patch.updated_at = new Date().toISOString();
    return api('ktt_applications?id=eq.' + encodeURIComponent(id),
      { method: 'PATCH', body: JSON.stringify(patch), prefer: 'return=representation' }
    ).then(function (d) {
      var moi = d && d[0];
      if (!moi) throw new Error('Không cập nhật được (RLS chặn?)');
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].id === id) { rows[i] = moi; break; }
      }
      return moi;
    });
  }

  /* ================= PHIÊN ================= */
  function saveSession(s) { try { sessionStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
  function readSession() { try { return JSON.parse(sessionStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
  function clearSession() { try { sessionStorage.removeItem(STORE); } catch (e) {} }

  function veManDangNhap(msg) {
    clearSession(); session = null;
    dashView.hidden = true; loginView.hidden = false;
    if (msg) { $('loginErr').textContent = msg; $('loginErr').classList.add('is-on'); }
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('loginErr'), btn = $('loginBtn');
    err.classList.remove('is-on');
    btn.disabled = true; btn.textContent = 'Đang đăng nhập...';

    authRequest('password', {
      email: $('admEmail').value.trim(),
      password: $('admPass').value
    })
      .then(function (s) { session = s; saveSession(s); $('admPass').value = ''; return loadRows(); })
      .then(function () { loginView.hidden = true; dashView.hidden = false; renderAll(); })
      .catch(function (e2) { err.textContent = e2.message; err.classList.add('is-on'); })
      .then(function () { btn.disabled = false; btn.textContent = 'Đăng nhập'; });
  });

  $('logoutBtn').addEventListener('click', function () { clearSession(); location.reload(); });
  $('reloadBtn').addEventListener('click', function () {
    var b = $('reloadBtn'); b.disabled = true; b.textContent = 'Đang tải...';
    loadRows().then(renderAll).catch(function (e) { alert(e.message); })
      .then(function () { b.disabled = false; b.textContent = 'Tải lại'; });
  });

  /* ================= NGÀY THÁNG ================= */
  function todayISO() {
    var d = new Date(), p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function addDaysISO(n) {
    var d = new Date(); d.setDate(d.getDate() + n);
    var p = function (x) { return x < 10 ? '0' + x : x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtNgay(iso) {
    if (!iso) return '';
    var x = String(iso).split('-');
    return x.length === 3 ? x[2] + '/' + x[1] : iso;
  }
  function conChay(r) { return DANG_CHAY.indexOf(r.status) > -1; }
  function quaHan(r) { return conChay(r) && r.follow_up_on && r.follow_up_on < todayISO(); }
  function homNay(r) { return conChay(r) && r.follow_up_on === todayISO(); }

  /* ================= RENDER ================= */
  function renderAll() {
    renderToday();
    renderStats();
    renderSalesCharts();
    renderDistCharts();
    renderFilters();
    renderList();
  }

  /* ---- Hôm nay ---- */
  function renderToday() {
    var late  = rows.filter(quaHan);
    var today = rows.filter(homNay);
    var moi   = rows.filter(function (r) { return r.status === 'moi'; });
    sortByGrade(late); sortByGrade(today); sortByGrade(moi);

    $('today').innerHTML =
      cot('Quá hạn follow-up', late, 'Hẹn gọi lại nhưng đã trôi qua', true) +
      cot('Follow-up hôm nay', today, 'Đúng hẹn hôm nay', false) +
      cot('Lead mới chưa liên hệ', moi, 'Xếp hạng A lên trước', false);

    bindMini();
  }

  function cot(title, list, sub, late) {
    var body = list.length
      ? '<div class="adm__mini">' + list.slice(0, 6).map(function (r) {
          return '<button class="adm__minirow" data-goto="' + r.id + '">' +
                   chipHang(r) + '<b>' + esc(hoTen(r)) + '</b>' +
                   (r.phone ? '<span>' + esc(r.phone) + '</span>' : '') +
                   (r.follow_up_on ? '<span>' + fmtNgay(r.follow_up_on) + '</span>' : '') +
                 '</button>';
        }).join('') +
        (list.length > 6 ? '<div class="adm__none" style="margin-top:8px">…và ' + (list.length - 6) + ' người nữa</div>' : '') +
        '</div>'
      : '<div class="adm__none">Không có ai.</div>';

    return '<div class="adm__todaycol' + (late ? ' adm__todaycol--late' : '') + '">' +
             '<h3>' + esc(title) + '<span class="adm__count">' + list.length + '</span></h3>' +
             '<p class="adm__todaysub">' + esc(sub) + '</p>' + body +
           '</div>';
  }

  function bindMini() {
    [].forEach.call(document.querySelectorAll('[data-goto]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.goto;
        fStatus = null; fGradeA = false; query = ''; $('search').value = '';
        openIds[id] = true;
        renderFilters(); renderList();
        var el = document.querySelector('[data-card="' + id + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  }

  /* ---- Thẻ số liệu ---- */
  function renderStats() {
    var t = rows.length;
    var d7 = rows.filter(function (r) { return +new Date(r.created_at) >= Date.now() - 7 * 864e5; }).length;
    var A = rows.filter(function (r) { return gradeOf(r) === 'A'; }).length;
    var chot = rows.filter(function (r) { return r.status === 'chot'; }).length;
    var chuaLienHe = rows.filter(function (r) { return r.status === 'moi'; }).length;
    var pct = function (n) { return t ? Math.round(n / t * 100) + '%' : '—'; };

    $('stats').innerHTML = [
      stat('Tổng đơn', t, d7 + ' đơn trong 7 ngày qua'),
      stat('Hạng A', A, t ? pct(A) + ' số đơn' : 'chưa có đơn'),
      stat('Đã chốt', chot, t ? 'tỉ lệ chốt ' + pct(chot) : '—'),
      stat('Chưa liên hệ', chuaLienHe, chuaLienHe ? 'cần xử lý' : 'sạch việc')
    ].join('');
  }
  function stat(l, v, s) {
    return '<div class="adm__stat"><dt>' + esc(l) + '</dt><dd>' + v +
           (s ? '<small>' + esc(s) + '</small>' : '') + '</dd></div>';
  }

  /* ---- Biểu đồ bán hàng ---- */
  function renderSalesCharts() {
    $('salesCharts').innerHTML = chartPheu() + chartNguon() + chartTuan() + chartTocDo();
  }

  function chartPheu() {
    var t = rows.length;
    if (!t) return khungTrong('Phễu chuyển đổi', 'Chưa có đơn nào.');
    var bars = PHEU.map(function (k) {
      // Phễu tích luỹ: "đã đi qua bước này" = đang ở bước đó hoặc xa hơn
      var n = rows.filter(function (r) {
        var i = PHEU.indexOf(r.status);
        return i > -1 && i >= PHEU.indexOf(k);
      }).length;
      return '<div class="adm__row">' +
               '<div class="adm__rowtop"><span>' + STATUS[k].label + '</span><b>' + n +
                 ' · ' + Math.round(n / t * 100) + '%</b></div>' +
               '<div class="adm__track"><div class="adm__fill" style="width:' + (n / t * 100) + '%"></div></div>' +
             '</div>';
    }).join('');
    var loai = rows.filter(function (r) { return LOAI.indexOf(r.status) > -1; }).length;
    return '<div class="adm__chart adm__funnel"><h3>Phễu chuyển đổi</h3>' +
           '<p class="adm__charthint">Số người đã đi tới bước này trở đi.</p>' + bars +
           '<div class="adm__loai">Đã loại: <b>' + loai + '</b> (từ chối / không phù hợp)</div></div>';
  }

  function chartNguon() {
    var m = {};
    rows.forEach(function (r) {
      var k = (r.source || '').trim() || '(không rõ)';
      m[k] = m[k] || { n: 0, a: 0, c: 0 };
      m[k].n++;
      if (gradeOf(r) === 'A') m[k].a++;
      if (r.status === 'chot') m[k].c++;
    });
    var ks = Object.keys(m).sort(function (x, y) { return m[y].n - m[x].n; });
    if (!ks.length) return khungTrong('Chất lượng nguồn', 'Chưa có dữ liệu nguồn.');

    var body = ks.map(function (k) {
      var v = m[k];
      return '<tr><td>' + esc(k) + '</td><td>' + v.n + '</td><td>' +
             Math.round(v.a / v.n * 100) + '%</td><td>' + Math.round(v.c / v.n * 100) + '%</td></tr>';
    }).join('');

    return '<div class="adm__chart"><h3>Chất lượng nguồn</h3>' +
           '<p class="adm__charthint">Kênh nào ra lead tốt, không chỉ ra nhiều lead.</p>' +
           '<table class="adm__tbl"><thead><tr><th>Nguồn</th><th>Đơn</th><th>% hạng A</th><th>% chốt</th></tr></thead>' +
           '<tbody>' + body + '</tbody></table></div>';
  }

  function chartTuan() {
    // 8 tuần gần nhất, tuần bắt đầu thứ Hai
    var mon = new Date();
    mon.setHours(0, 0, 0, 0);
    mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));   // getDay: CN=0 -> lùi về thứ Hai

    var weeks = [];
    for (var i = 7; i >= 0; i--) {
      var s = new Date(mon); s.setDate(s.getDate() - i * 7);
      var e = new Date(s); e.setDate(e.getDate() + 7);
      weeks.push({
        s: s, n: rows.filter(function (r) {
          var t = +new Date(r.created_at); return t >= +s && t < +e;
        }).length
      });
    }
    var max = Math.max.apply(null, weeks.map(function (w) { return w.n; })) || 1;
    var cols = weeks.map(function (w) {
      var p = function (x) { return x < 10 ? '0' + x : x; };
      return '<div class="adm__week">' +
               '<div class="adm__weeknum">' + (w.n || '') + '</div>' +
               '<div class="adm__weekbar" style="height:' + (w.n / max * 78) + '%"></div>' +
               '<div class="adm__weeklab">' + p(w.s.getDate()) + '/' + p(w.s.getMonth() + 1) + '</div>' +
             '</div>';
    }).join('');

    return '<div class="adm__chart"><h3>Đơn theo tuần</h3>' +
           '<p class="adm__charthint">8 tuần gần nhất, tính từ thứ Hai.</p>' +
           '<div class="adm__weeks">' + cols + '</div></div>';
  }

  function chartTocDo() {
    var gio = rows.filter(function (r) { return r.contacted_at; })
      .map(function (r) { return (+new Date(r.contacted_at) - +new Date(r.created_at)) / 36e5; })
      .filter(function (h) { return h >= 0; })
      .sort(function (a, b) { return a - b; });

    var chua = rows.filter(function (r) { return r.status === 'moi'; }).length;
    if (!gio.length) {
      return khungTrong('Tốc độ phản hồi',
        'Chưa có đơn nào được liên hệ.' + (chua ? ' Đang chờ: ' + chua + '.' : ''));
    }
    var tb = gio.reduce(function (a, b) { return a + b; }, 0) / gio.length;
    var tv = gio.length % 2 ? gio[(gio.length - 1) / 2] : (gio[gio.length / 2 - 1] + gio[gio.length / 2]) / 2;
    var doc = function (h) { return h < 24 ? h.toFixed(1) + ' giờ' : (h / 24).toFixed(1) + ' ngày'; };

    return '<div class="adm__chart"><h3>Tốc độ phản hồi</h3>' +
           '<p class="adm__charthint">Từ lúc nộp đơn tới lúc bạn liên hệ lần đầu.</p>' +
           '<div class="adm__row"><div class="adm__rowtop"><span>Trung bình</span><b>' + doc(tb) + '</b></div></div>' +
           '<div class="adm__row"><div class="adm__rowtop"><span>Trung vị</span><b>' + doc(tv) + '</b></div></div>' +
           '<div class="adm__loai">Đã tính trên ' + gio.length + ' đơn · chưa liên hệ: <b>' + chua + '</b></div></div>';
  }

  function khungTrong(title, msg) {
    return '<div class="adm__chart"><h3>' + esc(title) + '</h3>' +
           '<p class="adm__charthint" style="margin:0">' + esc(msg) + '</p></div>';
  }

  /* ---- Chân dung ---- */
  var DIST = [
    { key: 'situation', title: 'Tình trạng hiện tại' },
    { key: 'income',    title: 'Thu nhập mỗi tháng' },
    { key: 'urgency',   title: 'Muốn bắt đầu khi nào' },
    { key: 'location',  title: 'Tỉnh/thành' },
    { key: 'following', title: 'Theo dõi bao lâu' }
  ];
  function renderDistCharts() {
    var html = DIST.map(function (c) {
      var m = {};
      rows.forEach(function (r) { var v = (r[c.key] || '').trim(); if (v) m[v] = (m[v] || 0) + 1; });
      var ps = Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
      if (!ps.length) return khungTrong(c.title, 'Chưa có dữ liệu.');
      var max = ps[0][1];
      return '<div class="adm__chart"><h3>' + esc(c.title) + '</h3>' +
        ps.map(function (p) {
          return '<div class="adm__row"><div class="adm__rowtop"><span>' + esc(p[0]) + '</span><b>' + p[1] + '</b></div>' +
                 '<div class="adm__track"><div class="adm__fill adm__fill--dim" style="width:' +
                 Math.round(p[1] / max * 100) + '%"></div></div></div>';
        }).join('') + '</div>';
    }).join('');
    $('distCharts').innerHTML = html;
  }

  /* ---- Lọc ---- */
  function renderFilters() {
    var chips = ['<button class="adm__fchip' + (!fStatus && !fGradeA ? ' is-on' : '') +
                 '" data-f="all">Tất cả<i>' + rows.length + '</i></button>',
                 '<button class="adm__fchip' + (fGradeA ? ' is-on' : '') + '" data-f="A">Hạng A<i>' +
                 rows.filter(function (r) { return gradeOf(r) === 'A'; }).length + '</i></button>'];

    PHEU.concat(LOAI).forEach(function (k) {
      var n = rows.filter(function (r) { return r.status === k; }).length;
      if (!n && k !== 'moi') return;
      chips.push('<button class="adm__fchip' + (fStatus === k ? ' is-on' : '') + '" data-f="' + k + '">' +
                 STATUS[k].label + '<i>' + n + '</i></button>');
    });

    $('filters').innerHTML = chips.join('');
    [].forEach.call($('filters').querySelectorAll('[data-f]'), function (b) {
      b.addEventListener('click', function () {
        var f = b.dataset.f;
        if (f === 'all') { fStatus = null; fGradeA = false; }
        else if (f === 'A') { fGradeA = !fGradeA; }
        else { fStatus = fStatus === f ? null : f; }
        renderFilters(); renderList();
      });
    });
  }

  function sortByGrade(list) {
    var w = { A: 0, B: 1, C: 2 };
    list.sort(function (a, b) {
      var d = w[gradeOf(a)] - w[gradeOf(b)];
      return d !== 0 ? d : +new Date(b.created_at) - +new Date(a.created_at);
    });
    return list;
  }

  /* ---- Danh sách ---- */
  function renderList() {
    var q = query.toLowerCase().trim();
    var shown = rows.filter(function (r) {
      if (fStatus && r.status !== fStatus) return false;
      if (fGradeA && gradeOf(r) !== 'A') return false;
      if (!q) return true;
      return Object.keys(r).some(function (k) {
        return k !== 'id' && String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(q) > -1;
      });
    });
    sortByGrade(shown);

    var el = $('list');
    if (!shown.length) {
      el.innerHTML = '<div class="adm__empty">' +
        (rows.length ? 'Không có đơn nào khớp bộ lọc.' : 'Chưa có đơn đăng ký nào.') + '</div>';
      return;
    }
    el.innerHTML = shown.map(theDon).join('');
    bindCard();
  }

  function theDon(r) {
    var st = STATUS[r.status] || STATUS.moi;
    var late = quaHan(r);
    var mo = !!openIds[r.id];

    var hen = r.follow_up_on
      ? '<span class="adm__due' + (late ? ' adm__due--late' : '') + '">' +
        (late ? 'Quá hạn ' : 'Hẹn ') + fmtNgay(r.follow_up_on) + '</span>'
      : '';

    return '<article class="adm__card' + (late ? ' adm__card--late' : '') + '" data-card="' + r.id + '">' +
      '<button class="adm__cardhead" data-toggle="' + r.id + '">' +
        chipHang(r) +
        '<div class="adm__who"><b>' + esc(hoTen(r)) + '</b>' +
          '<div class="adm__meta">' +
            '<span class="adm__st adm__st--' + st.kieu + '">' + st.label + '</span>' + hen +
            (r.location ? '<span>' + esc(r.location) + '</span>' : '') +
            (r.income ? '<span>' + esc(r.income) + '</span>' : '') +
            (r.note && r.note.trim() ? '<span data-notechip>📝 có ghi chú</span>' : '') +
          '</div>' +
        '</div>' +
        '<span class="adm__when">' + fmtDate(r.created_at) + '</span>' +
      '</button>' +

      '<div class="adm__body' + (mo ? ' is-open' : '') + '"><div class="adm__bodyinner">' +
        '<div class="adm__detail">' + khoiCrm(r) + khoiChiTiet(r) + '</div>' +
      '</div></div></article>';
  }

  function khoiCrm(r) {
    var pills = PHEU.concat(LOAI).map(function (k) {
      return '<button class="adm__pill' + (r.status === k ? ' is-on' : '') +
             '" data-st="' + k + '" data-id="' + r.id + '">' + STATUS[k].label + '</button>';
    }).join('');

    return '<div class="adm__crm">' +
      '<p class="adm__crmlab">Trạng thái</p>' +
      '<div class="adm__pills">' + pills + '</div>' +

      '<div class="adm__crmgrid">' +
        '<div>' +
          '<p class="adm__crmlab">Hẹn liên hệ lại</p>' +
          '<div class="adm__date">' +
            '<input type="date" data-due="' + r.id + '" value="' + (r.follow_up_on || '') + '">' +
            '<button class="adm__mini-btn" data-due-add="3" data-id="' + r.id + '">+3 ngày</button>' +
            '<button class="adm__mini-btn" data-due-add="7" data-id="' + r.id + '">+1 tuần</button>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<p class="adm__crmlab">Ghi chú</p>' +
          '<textarea class="adm__note" data-note="' + r.id + '" placeholder="Gọi lúc nào, nói gì, chốt tới đâu...">' +
            esc(r.note || '') + '</textarea>' +
          '<div class="adm__save" data-save="' + r.id + '"></div>' +
        '</div>' +
      '</div>' +

      '<div class="adm__acts">' +
        (r.phone ? '<button class="adm__mini-btn" data-copy="' + esc(r.phone) + '">Copy SĐT</button>' +
                   '<a class="adm__mini-btn" href="' + zalo(r.phone) + '" target="_blank" rel="noreferrer">Mở Zalo</a>' : '') +
        (r.email ? '<a class="adm__mini-btn" href="mailto:' + esc(r.email) + '">Gửi email</a>' : '') +
      '</div>' +
    '</div>';
  }

  function khoiChiTiet(r) {
    return '<div class="adm__grid2">' +
        kv('Email', r.email ? '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : '—', true) +
        kv('Điện thoại', r.phone ? '<a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>' : '—', true) +
        kv('Tình trạng', r.situation || '—') +
        kv('Theo dõi', r.following || '—') +
        kv('Biết đến qua', r.source || '—') +
        kv('Sẵn sàng', r.commit || '—') +
      '</div>' +
      qa('Chuyên môn & công việc hiện tại', r.expertise) +
      qa('Vì sao muốn xây Kênh Tay Trái lúc này', r.why_now);
  }

  // dt/dd bắt buộc nằm trong dl, không thì HTML không hợp lệ
  function kv(l, v, raw) {
    return '<dl class="adm__qa' + (raw ? ' adm__contact' : '') + '"><dt>' + esc(l) + '</dt>' +
           '<dd>' + (raw ? v : esc(v)) + '</dd></dl>';
  }
  function qa(l, v) {
    if (!v || !String(v).trim()) return '';
    return '<dl class="adm__qa"><dt>' + esc(l) + '</dt><dd>' + esc(v) + '</dd></dl>';
  }
  function chipHang(r) {
    var g = gradeOf(r);
    return '<span class="adm__grade adm__grade--' + g + '" title="Hạng ' + g + '">' + g + '</span>';
  }
  function hoTen(r) {
    return ((r.first_name || '') + ' ' + (r.last_name || '')).trim() || '(không có tên)';
  }
  function zalo(p) {
    var s = String(p).replace(/\D/g, '');
    if (s.indexOf('0') === 0) s = '84' + s.slice(1);
    return 'https://zalo.me/' + s;
  }

  /* ---- Sự kiện trong thẻ ---- */
  function bindCard() {
    var el = $('list');

    [].forEach.call(el.querySelectorAll('[data-toggle]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.toggle;
        var body = b.nextElementSibling;
        var mo = body.classList.toggle('is-open');
        if (mo) openIds[id] = true; else delete openIds[id];
      });
    });

    // đổi trạng thái
    [].forEach.call(el.querySelectorAll('[data-st]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id, st = b.dataset.st;
        var r = rows.filter(function (x) { return x.id === id; })[0];
        if (!r || r.status === st) return;

        var patch = { status: st };
        // Đánh dấu MỘT LẦN thời điểm liên hệ đầu tiên (để đo tốc độ phản hồi)
        if (r.status === 'moi' && st !== 'moi' && !r.contacted_at) {
          patch.contacted_at = new Date().toISOString();
        }
        var pills = b.parentElement.querySelectorAll('.adm__pill');
        [].forEach.call(pills, function (p) { p.disabled = true; });

        patchRow(id, patch)
          .then(function () { renderAll(); })
          .catch(function (e) {
            alert('Không đổi được trạng thái: ' + e.message);
            [].forEach.call(pills, function (p) { p.disabled = false; });
          });
      });
    });

    // hẹn ngày
    [].forEach.call(el.querySelectorAll('[data-due]'), function (i) {
      i.addEventListener('change', function () {
        luuNgay(i.dataset.due, i.value || null);
      });
    });
    [].forEach.call(el.querySelectorAll('[data-due-add]'), function (b) {
      b.addEventListener('click', function () {
        luuNgay(b.dataset.id, addDaysISO(+b.dataset.dueAdd));
      });
    });

    // ghi chú: gõ thì debounce, rời ô thì lưu ngay
    [].forEach.call(el.querySelectorAll('[data-note]'), function (t) {
      var id = t.dataset.note;
      t.addEventListener('input', function () {
        clearTimeout(noteTimers[id]);
        bao(id, 'Đang gõ…');
        noteTimers[id] = setTimeout(function () { luuNote(id, t.value); }, 800);
      });
      t.addEventListener('blur', function () {
        clearTimeout(noteTimers[id]);
        var r = rows.filter(function (x) { return x.id === id; })[0];
        if (r && (r.note || '') !== t.value) luuNote(id, t.value);
      });
    });

    // copy SĐT
    [].forEach.call(el.querySelectorAll('[data-copy]'), function (b) {
      b.addEventListener('click', function () {
        var v = b.dataset.copy;
        var xong = function () {
          b.textContent = 'Đã copy ✓';
          setTimeout(function () { b.textContent = 'Copy SĐT'; }, 1500);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(v).then(xong, function () { prompt('Copy số này:', v); });
        else prompt('Copy số này:', v);
      });
    });
  }

  function luuNgay(id, val) {
    patchRow(id, { follow_up_on: val })
      .then(function () { renderAll(); })
      .catch(function (e) { alert('Không lưu được ngày hẹn: ' + e.message); });
  }

  // Lưu ghi chú KHÔNG render lại danh sách — render lại là mất focus đang gõ.
  // Nên chip "có ghi chú" phải tự cập nhật tại chỗ.
  function chipNote(id, co) {
    var meta = document.querySelector('[data-card="' + id + '"] .adm__meta');
    if (!meta) return;
    var cu = meta.querySelector('[data-notechip]');
    if (co && !cu) {
      var s = document.createElement('span');
      s.setAttribute('data-notechip', '');
      s.textContent = '📝 có ghi chú';
      meta.appendChild(s);
    } else if (!co && cu) { cu.remove(); }
  }

  function luuNote(id, val) {
    bao(id, 'Đang lưu…');
    patchRow(id, { note: val })
      .then(function () {
        bao(id, 'Đã lưu ✓');
        chipNote(id, !!(val || '').trim());
        renderToday();   // ghi chú không đổi phễu, chỉ cần làm mới khối Hôm nay
      })
      .catch(function (e) {
        bao(id, 'Lỗi — bấm để thử lại', true, function () { luuNote(id, val); });
      });
  }

  function bao(id, msg, loi, thuLai) {
    var d = document.querySelector('[data-save="' + id + '"]');
    if (!d) return;
    d.textContent = msg;
    d.className = 'adm__save' + (loi ? ' adm__save--err' : '');
    d.onclick = loi && thuLai ? thuLai : null;
  }

  $('search').addEventListener('input', function () { query = this.value; renderList(); });

  /* ---- CSV ---- */
  $('csvBtn').addEventListener('click', function () {
    if (!rows.length) return;
    var cols = Object.keys(rows[0]).concat(['hang']);
    var csv = [cols.join(',')].concat(rows.map(function (r) {
      return cols.map(function (c) {
        var v = c === 'hang' ? gradeOf(r) : r[c];
        return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      }).join(',');
    })).join('\n');
    var url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'crm-kenh-tay-trai.csv'; a.click();
    URL.revokeObjectURL(url);
  });

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---- Vào lại nếu phiên còn ---- */
  var ex = readSession();
  if (ex && ex.access_token) {
    session = ex;
    loadRows()
      .then(function () { loginView.hidden = true; dashView.hidden = false; renderAll(); })
      .catch(function () { veManDangNhap(); });
  }
})();
</script>
</body>
</html>
